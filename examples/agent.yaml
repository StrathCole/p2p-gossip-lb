# Backend Agent Configuration
# Example configuration for meshagent backend node

# LibP2P settings
identity_key: "CAESQNExample..." # Ed25519 private key in base64

listen_addrs:
  - "/ip4/0.0.0.0/tcp/4001"

bootstrap_peers:
  - "/dns4/bootstrap.mesh.example.com/tcp/4001/p2p/12D3KooW..."

# Backend settings
backend_url: "http://localhost:26657"
backend_type: "tendermint"
owner_address: "terra1exampleowner..."

# Health check
health_check_interval: 10s
health_check_timeout: 5s
health_check_path: "/health"

# Metrics collection
metrics_interval: 30s

# Node metadata
country: "US"
region: "us-east"
provider: "aws"
advertise_ips:
  - "203.0.113.20"

# Logging
log_level: "info"
