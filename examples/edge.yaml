# Edge Proxy Configuration
# Example configuration for meshproxy edge node

# Mesh/LibP2P settings
mesh:
  gossip_key: "CAESQNExample..." # Ed25519 private key in base64 (generate with: meshctl genkeys)
  listen_addrs:
    - "/ip4/0.0.0.0/tcp/4001"
  bootstrap:
    - "/dns4/bootstrap.mesh.example.com/tcp/4001/p2p/12D3KooW..."
  data_dir: "/var/lib/mesh"
  anti_entropy_every: 10s

# Edge proxy settings
edge:
  id: "edge-1"
  listen_http: ":8080"
  listen_https: ":443"
  chains:
    - "phoenix-1"
    - "osmosis-1"
  country: "US"
  region: "us-east"
  advertise_ips:
    - "203.0.113.10"

# TLS settings
tls:
  acme_email: "admin@example.com"
  domains:
    - "edge1.example.com"

# Rate limiting
rate_limit:
  per_ip_rps: 1000
  burst: 2000

# Cache settings
cache:
  enabled: true
  max_bytes: 536870912  # 512 MiB
  ttl_heighted: "infinite"

# Selector tuning
selector:
  delta_height: 2
  softmax_T: 0.7
