# DNS Server Configuration
# Example configuration for meshdns authoritative DNS server

# Mesh/LibP2P settings
mesh:
  gossip_key: "CAESQNExample..." # Ed25519 private key in base64 (generate with: meshctl genkeys)
  listen_addrs:
    - "/ip4/0.0.0.0/tcp/4001"
  bootstrap:
    - "/dns4/bootstrap.mesh.example.com/tcp/4001/p2p/12D3KooW..."
  data_dir: "/var/lib/mesh"
  anti_entropy_every: 10s

# DNS server settings
dns:
  listen: ":53"
  zone: "mesh.example.com"
  chains:
    - "phoenix-1"
    - "osmosis-1"
  ns_labels:
    - "ns1"
    - "ns2"
  ttl_ns_a: 30
  ttl_service: 20
  max_answers: 4
  ecs: true
  dnssec: false
  # Response Rate Limiting
  rrl_qps: 10000
  rrl_burst: 20000
  rrl_window: 5m

  # Geo-based DNS settings
  # Enable to return geographically closest edges to clients
  geo_enabled: true
  # Path to MaxMind GeoIP2 or GeoLite2 City database
  # Download from: https://dev.maxmind.com/geoip/geolite2-free-geolocation-data
  geo_city_db: "/var/lib/mesh/GeoLite2-City.mmdb"
  # Optional: Path to MaxMind GeoIP2 or GeoLite2 ASN database
  geo_asn_db: "/var/lib/mesh/GeoLite2-ASN.mmdb"
  # Weight for geo scoring (0.0-1.0, default: 0.5)
  # Higher values give more preference to geographic proximity
  geo_weight: 0.5
  # Reload geo databases every N seconds (0 = no automatic reload)
  # Useful when updating databases via geoipupdate
  geo_reload_sec: 86400  # 24 hours

# Selector tuning
selector:
  delta_height: 2
  softmax_T: 0.7
